<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <!-- USD.AI Faceted Logo Mark -->
  <g transform="translate(2, 6)">
    <!-- Top-left facet -->
    <polygon points="14,0 0,14 14,14" fill="#1C1917" />
    <!-- Top-right facet -->
    <polygon points="14,0 28,14 14,14" fill="#44403C" />
    <!-- Center top facet -->
    <polygon points="14,0 20,8 14,14 8,8" fill="#292524" />
    <!-- Bottom facet -->
    <polygon points="0,14 14,28 14,14" fill="#292524" />
    <polygon points="28,14 14,28 14,14" fill="#1C1917" />
  </g>
  <!-- Wordmark "USD.AI" -->
  <text x="40" y="27" font-family="'PPEiko', 'Times New Roman', Times, 'Didot', 'Playfair Display', Georgia, serif" font-size="22" font-weight="700" letter-spacing="-0.4px" fill="#1C1917">USD.AI</text>
</svg>
